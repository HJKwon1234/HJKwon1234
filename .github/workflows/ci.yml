name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate sites.json
        run: python -c "import json; print('sites:', len(json.load(open('sites.json'))))"

      - name: Import checks (engine + service + app)
        run: |
          python -c "import web_monitor_drill as e; print('engine OK', 'HTTP/2=%s'%e.HAS_H2)"
          python -c "import monitor_service; print('service OK')"
          python -c "import app; print('app OK')"

      - name: API smoke test (Flask test client)
        run: python tests/smoke_test.py
